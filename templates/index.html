<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Auth UI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="brand">
        <h1>Flask Auth UI</h1>
        <p>Login & Signup with encrypted and plain password storage</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="card">

        <div class="tabs">
            <button class="tab active" onclick="showTab('login')">Login</button>
            <button class="tab" onclick="showTab('signup')">Sign Up</button>
        </div>

        <!-- Login -->
        <div id="login" class="tab-content active">
            <form method="POST" action="{{ url_for('login') }}">

                <div class="field">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter username" required>
                </div>

                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="primary-btn">Login</button>

            </form>
        </div>

        <!-- Signup -->
        <div id="signup" class="tab-content">
            <form method="POST" action="{{ url_for('signup') }}">

                <div class="field">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Choose username" required>
                </div>

                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create password" required>
                </div>

                <div class="field">
                    <label>Password Storage Type</label>
                    <select name="encrypt">
                        <option value="true">Encrypted (Recommended)</option>
                        <option value="false">Plain Text (Demo Only)</option>
                    </select>
                </div>

                <button type="submit" class="primary-btn">Create Account</button>

            </form>
        </div>

    </div>
</div>

<script>
function showTab(tabId) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    document.querySelector(`[onclick="showTab('${tabId}')"]`).classList.add('active');
    document.getElementById(tabId).classList.add('active');
}
</script>

</body>
</html>
